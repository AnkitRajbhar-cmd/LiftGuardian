<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
  
  <!-- Start oval -->
  <ellipse cx="400" cy="40" rx="70" ry="30" fill="#f8d7da" stroke="#d1636a" stroke-width="2"/>
  <text x="400" y="45" text-anchor="middle" font-family="Arial" font-size="14">Start</text>
  
  <!-- Boxes and flow -->
  <!-- Sensor Setup -->
  <rect x="300" y="90" width="200" height="60" fill="#d1e7dd" stroke="#75b798" stroke-width="2" rx="5"/>
  <text x="400" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">1. Sensor Setup</text>
  <text x="400" y="135" text-anchor="middle" font-family="Arial" font-size="12">ISM3300DHCX Sensors</text>
  
  <line x1="400" y1="70" x2="400" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Data Collection -->
  <rect x="300" y="170" width="200" height="60" fill="#d1e7dd" stroke="#75b798" stroke-width="2" rx="5"/>
  <text x="400" y="195" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">2. Data Collection</text>
  <text x="400" y="215" text-anchor="middle" font-family="Arial" font-size="12">Body angles &amp; positioning</text>
  
  <line x1="400" y1="150" x2="400" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Data Processing -->
  <rect x="300" y="250" width="200" height="60" fill="#d1e7dd" stroke="#75b798" stroke-width="2" rx="5"/>
  <text x="400" y="275" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">3. Data Processing</text>
  <text x="400" y="295" text-anchor="middle" font-family="Arial" font-size="12">Arduino Nano processing</text>
  
  <line x1="400" y1="230" x2="400" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Posture Classification - Diamond shape -->
  <polygon points="400,330 500,370 400,410 300,370" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">4. Posture Classification</text>
  <text x="400" y="385" text-anchor="middle" font-family="Arial" font-size="12">Safe/Risky/Unsafe</text>
  
  <line x1="400" y1="310" x2="400" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Left branch - Safe -->
  <rect x="100" y="420" width="150" height="50" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2" rx="5"/>
  <text x="175" y="450" text-anchor="middle" font-family="Arial" font-size="14">Safe Posture</text>
  
  <line x1="300" y1="370" x2="175" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="230" y="400" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Safe</text>
  
  <!-- Center branch - Risky -->
  <rect x="325" y="420" width="150" height="50" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="5"/>
  <text x="400" y="450" text-anchor="middle" font-family="Arial" font-size="14">Warning Alert</text>
  
  <line x1="400" y1="410" x2="400" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="430" y="415" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Risky</text>
  
  <!-- Right branch - Unsafe -->
  <rect x="550" y="420" width="150" height="50" fill="#f8d7da" stroke="#d1636a" stroke-width="2" rx="5"/>
  <text x="625" y="450" text-anchor="middle" font-family="Arial" font-size="14">Immediate Alert</text>
  
  <line x1="500" y1="370" x2="625" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="570" y="400" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Unsafe</text>
  
  <!-- HC-05 Transmission -->
  <rect x="200" y="490" width="400" height="50" fill="#d1e7dd" stroke="#75b798" stroke-width="2" rx="5"/>
  <text x="400" y="520" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">5. HC-05 Bluetooth Transmission</text>
  
  <line x1="175" y1="470" x2="300" y2="490" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="470" x2="400" y2="490" stroke="#333" stroke-width="2"/>
  <line x1="625" y1="470" x2="500" y2="490" stroke="#333" stroke-width="2"/>
  
  <!-- Dashboard Visualization and Monitoring -->
  <rect x="200" y="560" width="400" height="50" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2" rx="5"/>
  <text x="400" y="590" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">6. Dashboard Visualization and Monitoring</text>
  
  <line x1="400" y1="540" x2="400" y2="560" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>